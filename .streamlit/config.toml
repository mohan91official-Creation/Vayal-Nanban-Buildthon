[theme]
base = "light"
primaryColor = "#087A55"
backgroundColor = "#FAFCF8"
secondaryBackgroundColor = "#EDF5EE"
textColor = "#123B2C"
linkColor = "#006C5B"
borderColor = "#C6D9C9"
greenColor = "#238B57"
greenBackgroundColor = "#E1F4E8"
greenTextColor = "#145C39"
orangeColor = "#C66B19"
orangeBackgroundColor = "#FFF0DD"
orangeTextColor = "#7B410C"
redColor = "#C33D32"
redBackgroundColor = "#FDE9E6"
redTextColor = "#81261F"
blueColor = "#147D92"
blueBackgroundColor = "#E2F3F6"
blueTextColor = "#0B5666"
violetColor = "#6D5BD0"
yellowColor = "#B8870B"
grayColor = "#60746A"
chartCategoricalColors = ["#087A55", "#147D92", "#C66B19", "#6D5BD0", "#D14E3F", "#6D8B3D"]
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 16
baseRadius = "14px"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = true
headingFontSizes = ["36px", "26px", "21px", "18px", "16px", "14px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]

[theme.sidebar]
backgroundColor = "#E5F1E7"
secondaryBackgroundColor = "#D6E9DB"
textColor = "#18372A"
primaryColor = "#087A55"
borderColor = "#B6CEBC"

[server]
headless = true
maxUploadSize = 8
enableStaticServing = true

[client]
showErrorDetails = "none"

[browser]
gatherUsageStats = false

